# Infrastructure Configuration

#Kafka
PROJ_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
PROJ_KAFKA_USERNAME: ${KAFKA_USERNAME:admin}
PROJ_KAFKA_PASSWORD: ${KAFKA_PASSWORD:password123}
PROJ_KAFKA_JAAS_CONFIG: ${KAFKA_JAAS_CONFIG:org.apache.kafka.common.security.scram.ScramLoginModule required username="${PROJ_KAFKA_USERNAME}" password="${PROJ_KAFKA_PASSWORD}";}
PROJ_KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
PROJ_KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}

#Topic
PORTFOLIO_CONSUMER_GROUP: ${PORTFOLIO_CONSUMER_ID:am-portfolio-group-1}
PORTFOLIO_TOPIC_NAME: ${PORTFOLIO_TOPIC:am-portfolio}
STOCK_CONSUMER_GROUP: ${STOCK_CONSUMER_ID:am-stock-group.v2}
STOCK_TOPIC_NAME: ${STOCK_TOPIC:am-stock-price-update}
MARKET_INDEX_CONSUMER_GROUP: ${MARKET_INDEX_CONSUMER_ID:am-market-index-group-1}
MARKET_INDEX_TOPIC_NAME: ${MARKET_INDEX_TOPIC:nse-stock-indices-update}

#Redis
PROJ_REDIS_HOSTNAME: ${REDIS_HOSTNAME:localhost}
PROJ_REDIS_PORT: ${REDIS_PORT:6379}
PROJ_REDIS_PASSWORD: ${REDIS_PASSWORD:password123}

spring:
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  application:
    name: portfolio-app
  profiles:
    include:
      - api
  kafka:
    bootstrap-servers: ${PROJ_KAFKA_BOOTSTRAP_SERVERS}
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
    properties:
      "[security.protocol]": ${PROJ_KAFKA_SECURITY_PROTOCOL}
      "[sasl.mechanism]": ${PROJ_KAFKA_SASL_MECHANISM}
      "[sasl.jaas.config]": ${PROJ_KAFKA_JAAS_CONFIG}
      "[ssl.endpoint.identification.algorithm]": ""
      "[ssl.truststore.location]": /etc/ssl/certs/java/cacerts
      "[ssl.truststore.password]": changeit
    consumer:
      group-id: ${PORTFOLIO_CONSUMER_GROUP}
      auto-offset-reset: latest
      enable-auto-commit: false
      max-poll-records: 100
  data:
    redis:
      host: ${PROJ_REDIS_HOSTNAME}
      port: ${PROJ_REDIS_PORT}
      password: ${PROJ_REDIS_PASSWORD}
      portfolio-mover:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:analysis:"
      portfolio-summary:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:summary:"
      portfolio-heatmap:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:heatmap:"
      portfolio-market-data:
        key-prefix: "portfolio:mktdata:"
        # Note: TTL is computed dynamically by PortfolioMarketDataRedisService.computeSmartTtl()
      portfolio-holdings:
        ttl: 900 # off-hours max; cash hours use smart 90s TTL in PortfolioHoldingsRedisService
        key-prefix: "portfolio:holdings:"
      portfolio-intel:
        ttl: 90 # seconds — Overview intelligence warm cache (fail-open)
        key-prefix: "portfolio:intel:v1:"
      portfolio-intel-hist:
        ttl: 300 # seconds — regression β / history for stress (longer than Overview)
        key-prefix: "portfolio:intel-hist:v1:"
      basket-etf:
        ttl: 86400 # 24 hours — enriched ETF constituents
        key-prefix: "basket:etf:enriched:v6:"
      basket-secmatch:
        ttl: 21600 # 6 hours — security name→ISIN matches
        key-prefix: "basket:secmatch:"
      basket-catalog:
        ttl: 3600 # 1 hour — curated basket themes
        key-prefix: "basket:catalog:"
      market-indices:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "market-indices:indices:"
        historical:
          key-prefix: "market-indices:historical-indices:"
          ttl: 129600 # 30 Days in seconds
      stock:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "stock:price:"
        historical:
          key-prefix: "stock:historical-price:"
          ttl: 129600 # 30 Days in seconds
      stock-indices:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "stock-indices:data:"
        historical:
          key-prefix: "stock-indices:historical-data:"
          ttl: 129600 # 30 Days in seconds
    mongodb:
      # MONGODB_CONNECTION_URL is injected by Vault in all environments (dev/staging/prod).
      # The localhost fallback is a safety net ONLY for local development runs without Vault.
      # It will NEVER be used in production — Vault always overrides it.
      uri: ${MONGODB_CONNECTION_URL:mongodb://localhost:27017/portfolio}
      database: ${MONGODB_DATABASE:portfolio}
      authentication-database: admin
  # Disable JDBC auto-configuration since we're using MongoDB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

nse:
  broad-market-indices:
    - NIFTY 50
    - NIFTY NEXT 50
    - NIFTY MIDCAP 50
    - NIFTY MIDCAP 100
    - NIFTY MIDCAP 150
    - NIFTY MIDCAP 250
    - NIFTY MIDCAP 500
    - NIFTY SMLCAP 100
    - NIFTY SMLCAP 250
    - NIFTY SMLCAP 500
  sector-indices:
    - NIFTY BANK
    - NIFTY IT
    - NIFTY PHARMA
    - NIFTY AUTO
    - NIFTY METAL
    - NIFTY ENERGY
    - NIFTY FMCG
    - NIFTY MEDIA
    - NIFTY REALTY
    - NIFTY PSU BANK

dev:
  tools:
    enabled: ${DEV_TOOLS_ENABLED:false}

app:
  scheduler:
    snapshot:
      active-user-window-days: ${SNAPSHOT_ACTIVE_USER_WINDOW_DAYS:30}
      max-backfill-days: ${SNAPSHOT_MAX_BACKFILL_DAYS:365}
  jwt:
    internal-secret: ${INTERNAL_SECRET_KEY:internal-service-super-secret-key-32chars-minimum-change-in-prod}
    secret: ${JWT_SECRET:internal-service-super-secret-key-32chars-minimum-change-in-prod}
    algorithm: ${JWT_ALGORITHM:HS256}
    # Laptop only: APP_JWT_VERIFY=false skips signature check so a prod token still works locally.
    # Pods leave this unset (true). User id still comes from the Bearer payload.
    verify: ${APP_JWT_VERIFY:true}
  demo:
    # ID of the shared development portfolio shown to users who have no portfolios yet.
    # Override via DEMO_PORTFOLIO_ID env-var in each environment / Vault mapping.
    portfolio-id: ${DEMO_PORTFOLIO_ID:}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      portfolio: ${PORTFOLIO_TOPIC:am-portfolio}
    trigger-calculation:
      consumer:
        id: am-portfolio-trigger-calculation-group
    portfolio:
      consumer:
        id: ${PORTFOLIO_CONSUMER_ID:am-portfolio-group-1}
        enabled: ${KAFKA_ENABLED:true}
        topic: ${PORTFOLIO_TOPIC:am-portfolio}
      publish-topic: ${PORTFOLIO_PUBLISH_TOPIC:am-portfolio-update}
      stream:
        topic: ${PORTFOLIO_STREAM_TOPIC:am-portfolio-stream}
    login:
      consumer:
        id: ${LOGIN_CONSUMER_ID:am-portfolio-login-group}
        enabled: ${LOGIN_KAFKA_ENABLED:false}
        topic: ${LOGIN_TOPIC:active-user}
    stock:
      consumer:
        id: ${STOCK_CONSUMER_GROUP}
        enabled: ${KAFKA_ENABLED:true}
        topic: ${STOCK_TOPIC_NAME}
    holding:
      consumer:
        id: ${HOLDING_CONSUMER_ID:am-portfolio-holding-group}
        enabled: ${KAFKA_ENABLED:true}
        topic: ${HOLDING_TOPIC:am-holding-update}
    market-index:
      consumer:
        id: ${MARKET_INDEX_CONSUMER_GROUP}
        enabled: ${KAFKA_ENABLED:true}
        topic: ${MARKET_INDEX_TOPIC_NAME}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    max-threads: 200
    min-spare-threads: 30
    max-connections: 4096
    accept-count: 100

etf:
  url: ${ETF_API_URL:http://localhost:8022}

basket:
  scheduler:
    enabled: false
  drafts:
    max-limit: ${BASKET_DRAFTS_MAX_LIMIT:5}
  create:
    # TTL for create-idempotency Mongo docs (retry window without unbounded growth)
    idempotency-ttl-seconds: ${BASKET_CREATE_IDEMPOTENCY_TTL_SECONDS:86400}
  holdings:
    enrichment:
      enabled: ${BASKET_HOLDINGS_ENRICHMENT:true}
  enrichment:
    connect-timeout-ms: ${BASKET_ENRICHMENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BASKET_ENRICHMENT_READ_TIMEOUT_MS:15000}
    chunk-size: ${BASKET_ENRICHMENT_CHUNK_SIZE:20}
    parallel-workers: ${BASKET_ENRICHMENT_PARALLEL_WORKERS:4}
  cache:
    etf-ttl-seconds: ${BASKET_ETF_L1_TTL_SECONDS:3600}
    secmatch-ttl-seconds: ${BASKET_SECMATCH_L1_TTL_SECONDS:21600}
    catalog-ttl-seconds: ${BASKET_CATALOG_L1_TTL_SECONDS:3600}
  catalog:
    write-token: ${BASKET_CATALOG_WRITE_TOKEN:}
  opportunities:
    discover-fast-path-enabled: ${BASKET_DISCOVER_FAST_PATH_ENABLED:true}

market-data:
  client:
    connect-timeout-ms: ${MARKET_DATA_CONNECT_TIMEOUT_MS:3000}
    # Fail-open: never block advanced/intraday UI on a 90s Upstox stall
    read-timeout-ms: ${MARKET_DATA_READ_TIMEOUT_MS:32000}
  api:
    base-url: ${MARKET_DATA_API_URL:http://am-market-data:8080}
    # Calendar must hit in-cluster market-data; public MARKET_DATA_API_URL gateway strips paths.
    calendar-base-url: ${MARKET_DATA_CALENDAR_BASE_URL:http://am-market-data:8080}
    ohlc-endpoint: /v1/market-data/ohlc
    historical-data-endpoint: /v1/market-data/historical-data
    historical-charts-endpoint: /v1/analysis/historical-charts
    securities-endpoint: /v1/securities
    nse-indices-endpoint: /v1/indices
    status-endpoint: /v1/market-calendar/status
    timings-endpoint: /v1/market-calendar/timings
    calendar-timeout-ms: ${MARKET_DATA_CALENDAR_TIMEOUT_MS:5000}
    # Hist START_END batches often need 5–8s; 10s was too tight under load.
    read-timeout: ${MARKET_DATA_API_READ_TIMEOUT_MS:45000}
    connection-timeout: 3000
    max-retry-attempts: 0
    batch:
      chunk-size: ${MARKET_DATA_BATCH_CHUNK_SIZE:50}
      parallel-batching-enabled: ${MARKET_DATA_PARALLEL_BATCHING:true}
      max-parallel-chunks: ${MARKET_DATA_MAX_PARALLEL_CHUNKS:4}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.portfolio: INFO
    com.portfolio.analytics: INFO
    com.portfolio.api: INFO
    com.portfolio.marketdata: INFO
    com.portfolio.model: INFO
    com.am.common: INFO
    com.am.common.amcommondata: INFO
    org.springframework.kafka: INFO

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
      validate-group-membership: false
      group:
        readiness:
          include: mongo,readinessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        external.api.call: true
      slo:
        http.server.requests: 100ms, 500ms, 1s, 5s, 10s, 20s, 30s
        external.api.call: 50ms, 200ms, 500ms, 1s, 5s, 10s, 30s
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true
    redis:
      enabled: ${PORTFOLIO_REDIS_ENABLED:false}
    kafka:
      enabled: ${KAFKA_ENABLED:true}
  tracing:
    # Cluster default on. Laptop: TRACING_ENABLED=false when no collector on :4318.
    enabled: ${TRACING_ENABLED:true}
    sampling:
      # 1.0 while validating flows in Tempo; dial helm back to 0.1 when comfortable
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c # Must match core-services: "traceparent" / "tracestate" headers

    # OTLP exporter — sends spans to the shared otel-collector over HTTP (port 4318).
    # In k8s the collector is in the "monitoring" namespace (same as am-core-services-otel).
    # In Docker compose: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
    # Local: leave endpoint; set TRACING_ENABLED=false so this exporter is not used.
    otlp:
      tracing:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# ─── Observability properties (am.observability.*) ───────────────────────────
# Enable the request-log filter and standard MDC fields:
# traceId, spanId, correlationId, service, request.method, request.path, http.status
am:
  observability:
    enabled: true
    request-log:
      enabled: true
      ignore-paths:
        - /actuator/**
        - /favicon.ico
        - /swagger-ui/**
        - /api-docs/**
        - /v3/api-docs/**

cache:
  redis:
    enabled: ${REDIS_CACHE_ENABLED:false}

portfolio:
  redis:
    enabled: ${PORTFOLIO_REDIS_ENABLED:false}
  intelligence:
    # Primary history benchmark (beta / relative return). Use "SENSEX" or "NIFTY 50".
    primary-benchmark-symbol: ${PORTFOLIO_INTEL_BENCHMARK:NIFTY 50}
    history-lookback-days: ${PORTFOLIO_INTEL_HISTORY_LOOKBACK_DAYS:90}
    history-timeout-ms: ${PORTFOLIO_INTEL_HISTORY_TIMEOUT_MS:800}
    # Stress / intel β load — longer than soft timeout so MD hist can succeed once and fill cache
    history-timeout-stress-ms: ${PORTFOLIO_INTEL_HISTORY_TIMEOUT_STRESS_MS:20000}
    # A/B/C diversification + annualized vol; default false keeps legacy count formula
    health-v2: ${PORTFOLIO_INTEL_HEALTH_V2:false}
    risk:
      top1-high-pct: 25.0
      sector-high-pct: 30.0
      sector-medium-pct: 20.0
      beta-high: 1.3
      beta-medium: 1.1

growthbook:
  api-host: ${GROWTHBOOK_API_HOST:https://growthbook.asrax.in/gbapi}
  client-key: ${GROWTHBOOK_CLIENT_KEY:sdk-8WmIFrhYLelAXr8}

# Shared with am-market-data SymbolOrchestratorService (previous-close / streamer universe)
market:
  active-symbols:
    enabled: ${MARKET_ACTIVE_SYMBOLS_ENABLED:true}
    redis-key: ${MARKET_ACTIVE_SYMBOLS_REDIS_KEY:market:active-symbols}
    bootstrap-on-startup: ${MARKET_ACTIVE_SYMBOLS_BOOTSTRAP_ON_STARTUP:true}
