# Preprod Environment Overrides — am-portfolio
# Preprod app host only — am.asrax.in reserved for prod
environment: preprod
replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Preprod Vault secret paths — key mappings are in vault-mappings.yaml
vault:
  secretPaths:
    auth:
      path: apps/data/preprod/services/am-auth
    infra:
      path: apps/data/preprod/infra/postgres
    portfolio:
      path: apps/data/preprod/services/am-portfolio
    parser:
      path: apps/data/preprod/services/am-parser
    logging:
      path: apps/data/preprod/services/logging
    market:
      path: apps/data/preprod/services/am-market-data
    mongodb:
      path: apps/data/preprod/infra/mongodb
    kafka:
      path: apps/data/preprod/infra/kafka
    redis:
      path: apps/data/preprod/infra/redis
    identity-oidc:
      path: apps/data/preprod/services/am-identity
    service-oauth:
      path: apps/data/preprod/services/am-portfolio

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /portfolio
          pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "preprod,security"
