# am-portfolio Universal Chart Values

replicaCount: 1
port: 8080
language: java

# Top-level service account (Fallback)
serviceAccountName: am-backend-sa

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  # Global vault settings
  vault:
    enabled: true
    role: "am-backend-role"
    serviceAccountName: "am-backend-sa"
    # Prod cluster has Vault Agent Injector sidecar, not secrets-store CSI driver CRDs.
    csi:
      enabled: false

image:
  repository: am-portfolio
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

security:
  automountServiceAccountToken: true

config: {}

# Vault Secret Injection Configuration
vault:
  enabled: true
  serviceAccountName: am-backend-sa
  role: am-backend-role
  csi:
    enabled: false

env:
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  KAFKA_ENABLED: "true"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  STOCK_TOPIC: "am-stock-price-update"
  STOCK_CONSUMER_GROUP: "am-portfolio-live-price-group"
  STOCK_CONSUMER_ID: "am-portfolio-live-price-group"
  PORTFOLIO_TOPIC: "am-portfolio"
  PORTFOLIO_CONSUMER_ID: "am-portfolio-group-1"
  MARKET_INDEX_TOPIC: "nse-stock-indices-update"
  MARKET_INDEX_CONSUMER_ID: "am-market-index-group-1"

probes:
  port: 8080
  startup:
    path: "/actuator/health"
    failureThreshold: 90
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    path: /actuator/health
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 5
  readiness:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5

# Scraped by am-infra Prometheus kubernetes-pods job
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Config block required by universal-chart templates.
config:
  batchSearch:
    enabled: false
