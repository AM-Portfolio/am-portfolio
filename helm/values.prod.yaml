# Prod Environment Overrides â€” am-portfolio
# Service-level Ingress (same model as am-identity), not central am-infra ingress.
environment: prod
replicaCount: 1

# Prod Vault secret paths â€” key mappings are in vault-mappings.yaml
vault:
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    auth:
      path: apps/data/prod/services/am-auth
    infra:
      path: apps/data/prod/infra/postgres
    portfolio:
      path: apps/data/prod/services/am-portfolio
    parser:
      path: apps/data/prod/services/am-parser
    logging:
      path: apps/data/prod/services/logging
    mongodb:
      path: apps/data/prod/infra/mongodb
    kafka:
      path: apps/data/prod/infra/kafka
    redis:
      path: apps/data/prod/infra/redis
    identity-oidc:
      path: apps/data/prod/services/am-identity
    service-oauth:
      path: apps/data/prod/services/am-portfolio

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /portfolio
          pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "prod,security"

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

global:
  image:
    tag: "31105657731"
