# Prod Environment Overrides — am-portfolio
# Service-level Ingress (same model as am-identity), not central am-infra ingress.
environment: prod
replicaCount: 1

global:
  vault:
    # The cluster uses Vault Agent Injector (sidecar), NOT the Secrets Store CSI Driver.
    # Explicitly disable CSI here to override the universal-chart default (which is true).
    # Without this, Helm tries to create a SecretProviderClass — a CRD that isn't installed.
    csi:
      enabled: false

# Prod Vault secret paths — key mappings are in vault-mappings.yaml
vault:
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    auth:
      path: apps/data/prod/services/am-auth
    infra:
      path: apps/data/prod/infra/postgres
    portfolio:
      path: apps/data/prod/services/am-portfolio
    parser:
      path: apps/data/prod/services/am-parser
    logging:
      path: apps/data/prod/services/logging
    mongodb:
      path: apps/data/prod/infra/mongodb
    kafka:
      path: apps/data/prod/infra/kafka
    redis:
      path: apps/data/prod/infra/redis
    identity-oidc:
      path: apps/data/prod/services/am-identity
    service-oauth:
      path: apps/data/prod/services/am-portfolio

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /portfolio
          pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "prod,security"
  DEMO_PORTFOLIO_ID: "f969745c-f492-4b86-88ed-6588e9f28bb3"

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

