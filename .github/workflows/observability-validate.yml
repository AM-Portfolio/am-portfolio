name: observability-validate

on:
  pull_request:
    paths:
      - "observability.yaml"
      - ".github/workflows/observability-validate.yml"
  push:
    branches: [main, master]
    paths:
      - "observability.yaml"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout am-observability
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/am-observability
          path: am-observability
          ref: ${{ vars.AM_OBS_REF || 'main' }}
        continue-on-error: true

      - name: Checkout am-observability fallback
        if: hashFiles('am-observability/gen.py') == ''
        uses: actions/checkout@v4
        with:
          repository: ssd2658/am-observability
          path: am-observability
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Doctor
        working-directory: am-observability
        run: |
          python -m pip install -r requirements.txt
          python gen.py doctor ../observability.yaml
