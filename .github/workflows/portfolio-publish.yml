name: Portfolio Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "portfolio-**"
      - "am-common-data/**"
      - "helm/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/portfolio-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "portfolio-**"
      - "am-common-data/**"
      - "helm/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/portfolio-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Portfolio
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "java"
      working_directory: "."
      image_name: "am-portfolio"
      build_context: "."
    secrets: inherit
