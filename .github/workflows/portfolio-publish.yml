name: Portfolio Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "portfolio-**"
      - "am-common-data/**"
      - "helm/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/portfolio-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "portfolio-**"
      - "am-common-data/**"
      - "helm/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/portfolio-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Portfolio
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "java"
      working_directory: "."
      # Contabo / Argo service name. GHCR path defaults to am-portfolio/am-portfolio
      # (repo-scoped) so GITHUB_TOKEN can write_package. Do NOT set ghcr_image_name
      # to the flat org package "am-portfolio" — that package is unlinked and
      # Actions gets permission_denied: write_package.
      image_name: "am-portfolio"
      build_context: "."
      # pin-then-sync.sh lives on am-pipelines main (not develop).
      pipelines_ref: "main"
    secrets: inherit
